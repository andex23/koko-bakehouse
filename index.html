<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf1">
  <meta name="description" content="Browse Koko Bakehouse’s weekend menu and order bread, meat pies and small chops for home delivery on WhatsApp.">
  <title>Koko Bakehouse · Weekend delivery</title>
  <link rel="stylesheet" href="styles.css">
  <script src="order.js" defer></script>
</head>
<body>
  <header class="masthead">
    <span class="wordmark">Koko Bakehouse</span>
    <a class="menu-link" href="#menu">Weekend menu</a>
  </header>
  <main>
    <section class="hero" aria-labelledby="headline">
      <div class="hero-copy">
        <h1 id="headline">Weekend delivery now open</h1>
        <p>Milk bread, meat pies and small chops, delivered on Saturdays and Sundays.</p>
        <a class="button" href="#menu">Pick your bakes</a>
      </div>
      <picture>
        <source media="(max-width: 699px)" srcset="assets/weekend-phone.webp">
        <img src="assets/weekend.webp" alt="Koko bread bag and two golden meat pies on a gingham cloth"
             width="1400" height="933" fetchpriority="high">
      </picture>
    </section>
    <section id="menu" aria-labelledby="menu-title">
      <header class="menu-header">
        <h2 id="menu-title">The weekend menu</h2>
        <p id="hint" hidden>Select items for your order</p>
      </header>
      <ul class="menu-grid">
        <li>
          <label class="product">
            <img src="assets/milk-bread.webp" alt="A sliced, golden pull-apart loaf" width="520" height="520" loading="lazy">
            <span class="product-heading">
              <strong>Milk bread</strong>
              <input type="checkbox" value="Milk bread" aria-label="Include Milk bread in order" hidden>
            </span>
            <span class="description">One buttery pull-apart loaf</span>
            <b>₦2,500</b>
          </label>
        </li>
        <li>
          <label class="product">
            <img src="assets/beef-pie.webp" alt="Crimped pastry opened to show the beef filling" width="520" height="520" loading="lazy">
            <span class="product-heading">
              <strong>Beef meat pie</strong>
              <input type="checkbox" value="Beef meat pie" aria-label="Include Beef meat pie in order" hidden>
            </span>
            <span class="description">One flaky pie with beef and potato</span>
            <b>₦1,200</b>
          </label>
        </li>
        <li>
          <label class="product">
            <img src="assets/puff-puff.webp" alt="Golden puff-puff piled in a shallow bowl" width="520" height="520" loading="lazy">
            <span class="product-heading">
              <strong>Puff-puff</strong>
              <input type="checkbox" value="Puff-puff" aria-label="Include Puff-puff in order" hidden>
            </span>
            <span class="description">Six lightly sweetened dough balls</span>
            <b>₦1,000</b>
          </label>
        </li>
        <li>
          <label class="product">
            <img src="assets/small-chops.webp" alt="Open box of samosas, spring rolls and puff-puff" width="520" height="520" loading="lazy">
            <span class="product-heading">
              <strong>Small chops box</strong>
              <input type="checkbox" value="Small chops box" aria-label="Include Small chops box in order" hidden>
            </span>
            <span class="description">Samosas, spring rolls and puff-puff</span>
            <b>₦3,500</b>
          </label>
        </li>
      </ul>
      <div class="order-row">
        <a id="order" class="button" href="https://wa.me/2348000000000?text=Hi%20Koko%20Bakehouse%21%20I%27d%20like%20to%20place%20a%20weekend%20delivery%20order.">Order on WhatsApp</a>
        <p>Confirm quantities and delivery details in chat.</p>
      </div>
    </section>
  </main>
</body>
</html>
